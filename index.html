<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock Paper Scissors</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <h1>Rock Paper Scissors</h1>
      <p>Play a classic match against the computer.</p>
    </header>
    <section class="score-board">
      <div class="score-card">
        <span class="score-label">Player</span>
        <span id="player-score" class="score-value font-mono">0</span>
      </div>
      <div class="score-card">
        <span class="score-label">Computer</span>
        <span id="computer-score" class="score-value font-mono">0</span>
      </div>
    </section>
    <section class="arena">
      <div class="combatant">
        <span class="combatant-label">You</span>
        <div id="player-display" class="display-box">
          <span class="placeholder">-</span>
        </div>
      </div>
      <div class="vs">vs</div>
      <div class="combatant">
        <span class="combatant-label">Computer</span>
        <div id="computer-display" class="display-box">
          <span class="placeholder">-</span>
        </div>
      </div>
    </section>
    <section id="result-message" class="result-message">
      Choose your weapon to start the round.
    </section>
    <section class="controls">
      <button id="btn-rock" class="btn" data-choice="rock">Rock</button>
      <button id="btn-paper" class="btn" data-choice="paper">Paper</button>
      <button id="btn-scissors" class="btn" data-choice="scissors">Scissors</button>
    </section>
    <footer class="footer">
      <button id="btn-reset" class="btn-secondary">Reset Score</button>
    </footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
